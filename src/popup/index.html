<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; media-src 'self' blob:">
<title>WaterBuddy</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="actor">
    <div id="msg" role="status"></div>
    <div id="progress"><span id="progress-text"></span><div id="bar"><div id="fill"></div></div></div>
    <div id="buttons">
      <button id="drink" class="primary">Drinking now 💧</button>
      <button id="later">I will do it later<small id="later-hint"></small></button>
    </div>
    <div id="figure"></div>
  </div>
  <audio id="song" loop></audio>
  <audio id="sad-song" loop></audio>
  <script src="popup.js"></script>
</body>
</html>
